---
name: Build artifacts

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build JAR
        shell: bash
        run: |
          VERSION_ARG=()
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            VERSION_ARG=(-PreleaseVersion="${{ steps.version.outputs.value }}")
          fi
          ./gradlew jar "${VERSION_ARG[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: JCProfilerNext-jar
          path: build/libs/*.jar

  build-native:
    name: Build native binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: JCProfilerNext-linux-x64
          - os: windows-latest
            name: Windows
            artifact: JCProfilerNext-windows-x64
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native app-image
        shell: bash
        run: |
          VERSION_ARG=()
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            VERSION_ARG=(-PreleaseVersion="${{ steps.version.outputs.value }}")
          fi
          ./gradlew jpackage "${VERSION_ARG[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/jpackage/JCProfilerNext
